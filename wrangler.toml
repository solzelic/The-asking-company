# Cloudflare Worker with static assets. See README.md → "Going live".
name = "the-asking-company"
main = "src/worker.js"
compatibility_date = "2026-09-01"

[assets]
directory = "./dist"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
run_worker_first = ["/api/*", "/og/*"]

[vars]
CURRENCY = "usd"
# Comma-separated words that turn a ledger name into "Anonymous".
BLOCKED_WORDS = ""

# The database (Storage & Databases → D1 → asking-company).
[[d1_databases]]
binding = "DB"
database_name = "asking-company"
database_id = "45b4a6ce-7b34-4822-a8f4-64ac08289ff7"
migrations_dir = "migrations"

# Secrets (never commit these; set them in the dashboard → Settings → Variables and Secrets):
#   STRIPE_SECRET_KEY      sk_live_… or sk_test_…
#   STRIPE_WEBHOOK_SECRET  whsec_…
